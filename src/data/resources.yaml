# Open datasets and software released by the group.
# kind: dataset | software. Each entry needs one to three links.

# --- Datasets ---------------------------------------------------------------

- id: surgatlas
  name: SurgAtlas
  kind: dataset
  year: 2026
  featured: true
  summary: A surgical video-language dataset of 15,291 videos (2,391 hours) across 18 specialties, and the first to include open surgery at scale alongside minimally invasive procedures.
  topics: [health, language]
  links:
    - { label: Paper, href: 'https://arxiv.org/abs/2606.25905' }

- id: youcook2
  name: YouCook2
  kind: dataset
  year: 2018
  featured: true
  summary: 2,000 untrimmed cooking videos from YouTube, 176 hours in all, covering 89 recipes. Every procedure step is annotated with temporal boundaries and an imperative English sentence.
  topics: [language, video]
  links:
    - { label: Website, href: 'http://youcook2.eecs.umich.edu/' }
    - { label: Paper, href: 'https://arxiv.org/abs/1703.09788' }
    - { label: Code, href: 'https://github.com/LuoweiZhou/ProcNets-YouCook2' }

- id: activitynet-entities
  name: ActivityNet-Entities
  kind: dataset
  year: 2019
  featured: true
  summary: About 158,000 bounding boxes that ground the noun phrases of about 52,000 ActivityNet Captions segments, one frame per phrase, released with Grounded Video Description (CVPR 2019 oral).
  topics: [language, video]
  links:
    - { label: Paper, href: 'https://arxiv.org/abs/1812.06587' }
    - { label: Data, href: 'https://github.com/facebookresearch/ActivityNet-Entities' }
    - { label: Code, href: 'https://github.com/facebookresearch/grounded-video-description' }

- id: a2d
  name: 'A2D: Actor-Action Dataset'
  kind: dataset
  year: 2015
  featured: true
  summary: 3,782 YouTube videos of seven kinds of actor doing eight actions, with pixel-level actor and action labels on three to five frames of each video, built for joint actor-action recognition and semantic segmentation.
  topics: [video]
  links:
    - { label: Website, href: 'https://web.eecs.umich.edu/~jjcorso/r/a2d/' }
    - { label: Paper, href: 'https://web.eecs.umich.edu/~jjcorso/pubs/xu_corso_CVPR2015_A2D.pdf' }

- id: robotslang
  name: RobotSlang
  kind: dataset
  year: 2020
  summary: A benchmark of 169 text dialogs, nearly 5,000 utterances, in which a human driver steers a small physical robot through 116 tabletop mazes while a human commander guides it, with over 1,000 minutes of robot camera and control streams.
  topics: [robotics, language]
  links:
    - { label: Code, href: 'https://github.com/MichiganCOG/RobotSlangBenchmark' }
    - { label: Paper, href: 'https://arxiv.org/abs/2010.12639' }

- id: devil
  name: DEVIL
  kind: dataset
  year: 2022
  summary: 'A diagnostic benchmark for video inpainting: 1,250 clips, labeled by attributes such as camera and scene motion and scored on ten slices with five metrics, so that failure modes can be isolated and compared.'
  topics: [video, learning]
  links:
    - { label: Code, href: 'https://github.com/MichiganCOG/devil' }
    - { label: Paper, href: 'https://arxiv.org/abs/2105.05332' }

- id: forcepose
  name: ForcePose
  kind: dataset
  year: 2022
  summary: Eight people doing five movements, effectively 1,344 videos, with pose detections and synchronized force plate data, for estimating ground reaction forces from video alone.
  topics: [video]
  links:
    - { label: Code, href: 'https://github.com/MichiganCOG/ForcePose' }
    - { label: Paper, href: 'https://arxiv.org/abs/2207.05845' }

- id: surgical-hands
  name: Surgical Hands
  kind: dataset
  year: 2023
  summary: About 8,100 annotated hand poses in 76 clips from 28 publicly available surgical videos, released with the CondPose tracking method.
  topics: [health, video]
  links:
    - { label: Code, href: 'https://github.com/MichiganCOG/Surgical_Hands_RELEASE' }
    - { label: Paper, href: 'https://arxiv.org/abs/2101.04281' }

- id: youcook
  name: YouCook
  kind: dataset
  year: 2013
  summary: 88 third-person cooking videos from YouTube in six cooking styles, each with several human descriptions. The 49 training videos also have object annotations.
  topics: [language, video]
  links:
    - { label: Website, href: 'https://web.eecs.umich.edu/~jjcorso/r/youcook/' }

- id: chen-xiph
  name: Chen Xiph.org
  kind: dataset
  year: 2010
  summary: Eight xiph.org videos labeled pixel by pixel with the 24 MSRC semantic classes, 638 labeled frames in all, built to evaluate label propagation and later used to benchmark supervoxel methods.
  topics: [video]
  links:
    - { label: Website, href: 'https://web.eecs.umich.edu/~jjcorso/r/labelprop.html' }

# --- Software ---------------------------------------------------------------

- id: fiftyone
  name: FiftyOne
  kind: software
  year: 2020
  featured: true
  summary: An open-source tool for visualizing and analyzing datasets and debugging models, with more than three million installs. Built at Voxel51, the company Prof. Corso co-founded.
  topics: [learning]
  links:
    - { label: Code, href: 'https://github.com/voxel51/fiftyone' }
    - { label: Voxel51, href: 'https://voxel51.com/' }

- id: vip
  name: ViP
  kind: software
  year: 2019
  featured: true
  summary: A PyTorch video platform that makes it easier to train and compare models for action recognition and object detection.
  topics: [video]
  links:
    - { label: Code, href: 'https://github.com/MichiganCOG/ViP' }
    - { label: Paper, href: 'https://arxiv.org/abs/1910.02793' }

- id: tased-net
  name: TASED-Net
  kind: software
  year: 2019
  summary: A temporally aggregating spatial encoder-decoder network for video saliency detection (ICCV 2019).
  topics: [video]
  links:
    - { label: Paper, href: 'https://arxiv.org/abs/1908.05786' }
    - { label: Code, href: 'https://github.com/MichiganCOG/TASED-Net' }

- id: a2cl-pt
  name: A2CL-PT
  kind: software
  year: 2020
  summary: Finds when activities start and end in a video from video-level labels alone. On THUMOS14 it reached an average mAP of 30.0%, against 27.9% for the best earlier weakly supervised method (ECCV 2020).
  topics: [video]
  links:
    - { label: Code, href: 'https://github.com/MichiganCOG/A2CL-PT' }
    - { label: Paper, href: 'https://arxiv.org/abs/2007.06643' }

- id: gaze-attention
  name: Gaze-Attention
  kind: software
  year: 2021
  summary: Integrates human gaze into spatiotemporal attention for egocentric activity recognition (WACV 2021).
  topics: [video, human]
  links:
    - { label: Code, href: 'https://github.com/MichiganCOG/Gaze-Attention' }
    - { label: Paper, href: 'https://arxiv.org/abs/2011.03920' }

- id: unified-vlp
  name: Unified VLP
  kind: software
  year: 2020
  summary: Unified vision-language pretraining for image captioning and visual question answering (AAAI 2020).
  topics: [language]
  links:
    - { label: Paper, href: 'https://arxiv.org/abs/1909.11059' }
    - { label: Code, href: 'https://github.com/LuoweiZhou/VLP' }

- id: bubblenets
  name: BubbleNets
  kind: software
  year: 2019
  summary: Learns to select the best frame for a person to annotate in video object segmentation (CVPR 2019 oral, best paper finalist).
  topics: [video]
  links:
    - { label: Paper, href: 'https://arxiv.org/abs/1903.11779' }
    - { label: Code, href: 'https://github.com/griffbr/BubbleNets' }

- id: video-grounding
  name: Video Object Grounding
  kind: software
  year: 2018
  summary: Weakly supervised grounding of objects in video from text, using loss weighting and object interaction (BMVC 2018).
  topics: [language, video]
  links:
    - { label: Paper, href: 'https://arxiv.org/abs/1805.02834' }
    - { label: Code, href: 'https://github.com/MichiganCOG/Video-Grounding-from-Text' }

- id: dense-captioning
  name: Dense Video Captioning
  kind: software
  year: 2018
  summary: End-to-end dense video captioning with a masked transformer (CVPR 2018).
  topics: [language, video]
  links:
    - { label: Paper, href: 'https://arxiv.org/abs/1804.00819' }
    - { label: Code, href: 'https://github.com/LuoweiZhou/densecap' }

- id: m-pact
  name: M-PACT
  kind: software
  year: 2018
  summary: A TensorFlow platform for repeatable activity classification research, with shared pipelines for training and evaluating video models.
  topics: [video]
  links:
    - { label: Code, href: 'https://github.com/MichiganCOG/M-PACT' }
    - { label: Paper, href: 'https://arxiv.org/abs/1804.05879' }

- id: click-here-cnn
  name: Click-Here CNN
  kind: software
  year: 2017
  summary: Human-in-the-loop viewpoint estimation, where a keypoint located by a person guides the network (ICCV 2017).
  topics: [human, video]
  links:
    - { label: Paper, href: 'https://arxiv.org/abs/1703.09859' }
    - { label: Code, href: 'https://github.com/rszeto/click-here-cnn' }

- id: mint
  name: MINT
  kind: software
  year: 2020
  summary: Deep network compression that trims neurons using the mutual information between adjacent layers.
  topics: [learning]
  links:
    - { label: Code, href: 'https://github.com/MichiganCOG/MINT' }
    - { label: Paper, href: 'https://arxiv.org/abs/2003.08472' }

- id: libsvx
  name: LIBSVX
  kind: software
  year: 2012
  summary: A supervoxel library and benchmark for early video processing. The benchmark compares seven supervoxel methods, five off-line and two streaming, on six video datasets with seven quality metrics.
  topics: [video]
  awards:
    - Best Open Source Code, 3rd Prize, CVPR 2012
    - Best Demo Prize, Greater New York Multimedia and Vision Meeting 2012
  links:
    - { label: Website, href: 'https://web.eecs.umich.edu/~jjcorso/r/supervoxels/' }

- id: action-bank
  name: Action Bank
  kind: software
  year: 2012
  summary: A high-level representation of activity in video, built from many individual action detectors sampled across semantic and viewpoint space.
  topics: [video]
  awards:
    - Best Open Source Code, 3rd Prize, CVPR 2012
  links:
    - { label: Website, href: 'https://web.eecs.umich.edu/~jjcorso/r/actionbank/' }

- id: random-forest-distance
  name: Random Forest Distance
  kind: software
  year: 2012
  summary: Tree-structured metric learning that adapts the distance function across the feature space (KDD 2012).
  topics: [learning]
  links:
    - { label: Paper, href: 'https://arxiv.org/abs/1201.0610' }
    - { label: 'Download (.zip)', href: 'https://web.eecs.umich.edu/~jjcorso/pubs/RFD_Package.zip' }

- id: graph-shifts
  name: Graph-Shifts
  kind: software
  year: 2008
  summary: Greedy hierarchical energy minimization for joint image segmentation and labeling, in two and three dimensions.
  topics: [learning, health]
  links:
    - { label: Website, href: 'https://web.eecs.umich.edu/~jjcorso/r/graphshifts/' }
