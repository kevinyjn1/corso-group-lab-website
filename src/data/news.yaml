# News from the group, shown on the home page ("What's new at Corso Group") and on /news/.
#
# To add an item, copy one below and put it anywhere in this file: the site sorts by date.
#   id       a short name of its own, in lowercase with dashes
#   date     "YYYY-MM-DD", or "YYYY-MM" when the day is not known. Shown as month and year.
#   kind     milestone | papers | press | project | teaching | people | award | talk | release
#   title    what happened, in a few plain words, with no full stop
#   summary  one or two sentences (optional)
#   link     where to read more: a full address for another site, or a path on this one that
#            starts with "/" (for example "/vigil/#site-visit")
#   paper    in place of link, for a paper on the publication list: its id in
#            publications.yaml. The address is then taken from that list.
#   linkLabel  the words of that link, saying what it opens
#
# Say what happened and let the reader judge it: no "excited to announce", no "flagship".

