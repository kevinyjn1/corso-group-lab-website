name: Old address

# The site used to be published from this repository, at this repository's GitHub Pages address.
# It is now published from the content repository. This workflow puts a small page at the old
# address that sends visitors to the new one. Run it by hand (Actions, "Old address", "Run
# workflow"); it is needed again only if the new address changes.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Package the page
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .github/old-address

  redirect:
    # A job of its own: published in the same job as the upload, the package is sometimes not
    # yet listed when the publish step looks for it, and the step fails.
    name: Point the old address at the new one
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v5
