name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets the site be published again by hand (Actions, CI, "Run workflow"). Re-running a failed
  # deploy job inside an old run does not work: the run then holds two copies of the site package.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer push replaces an older pull request run. Runs on main always finish, so a deployment
  # is never cut off half way.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify (${{ matrix.mount }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The site has to work at a domain root and under a sub-path, which is how GitHub Pages
        # and personal web directories serve it.
        include:
          - mount: domain root
            base-path: /
          - mount: sub-path
            base-path: /~jjcorso/
    env:
      BASE_PATH: ${{ matrix.base-path }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Formatting
        run: npm run format:check
      - name: Types and content schema
        run: npm run check
      - name: The content gate's own tests
        run: npm run test:gate
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Build and end-to-end tests
        run: npm test
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ strategy.job-index }}
          path: playwright-report/
          retention-days: 7

  release:
    # The content repository publishes the site with the code at `release`: the newest commit of
    # main that has passed every check above. A push that fails leaves `release` where it was, so
    # a mistake in the code cannot stop the next change of content from being published.
    name: Mark this commit as the code to publish with
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      # This job runs nothing from the repository: it only moves a branch.
      - uses: actions/checkout@v7
      - run: git push --force origin "HEAD:refs/heads/release"

  deploy:
    name: Deploy to GitHub Pages
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      # This deployment is a preview that the group has not reviewed, so search engines are asked
      # not to list it. Delete this setting to let the site be found.
      SITE_NOINDEX: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Look up the Pages address
        id: pages
        uses: actions/configure-pages@v6
      - name: Build for the Pages address
        run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
      - name: Confirm the build is hidden from search
        if: env.SITE_NOINDEX == 'true'
        run: grep -q 'name="robots" content="noindex"' dist/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Check the live site responds
        run: >
          curl --fail --silent --show-error --output /dev/null
          --retry 6 --retry-delay 10 --retry-all-errors
          "${{ steps.deployment.outputs.page_url }}"
