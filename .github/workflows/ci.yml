# The checks of the site's code. This workflow does not publish: the site is published from the
# content repository, with the code this workflow marks as `release`.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer push replaces an older pull request run. Runs on main always finish, so `release` is
  # only ever moved by a run that tested the commit it moves to.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify (${{ matrix.mount }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The site has to work at a domain root and under a sub-path, which is how GitHub Pages
        # and personal web directories serve it.
        include:
          - mount: domain root
            base-path: /
          - mount: sub-path
            base-path: /~jjcorso/
    env:
      BASE_PATH: ${{ matrix.base-path }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Formatting
        run: npm run format:check
      - name: Types and content schema
        run: npm run check
      - name: The content gate and the content rules
        run: npm run test:content
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Build and end-to-end tests
        run: npm test
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ strategy.job-index }}
          path: playwright-report/
          retention-days: 7

  live-content:
    # The site is published from the live content, which changes without the code changing. This
    # job builds that content with this commit's code and runs the publishing checks, so that a
    # change to the code which the live content cannot be built with is caught here, and not by
    # the next person who saves a form.
    name: Verify (live content)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CONTENT_DIR: content
    steps:
      - uses: actions/checkout@v7
      - name: Get the live content
        uses: actions/checkout@v7
        with:
          repository: ${{ vars.CONTENT_REPOSITORY || 'kevinyjn1/corso-group-lab-website-content' }}
          path: incoming
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: The content gate
        run: node scripts/content-gate.mjs incoming content
      - name: The content rules
        run: npx astro sync
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Build and publishing checks
        run: npx playwright test tests/publish.spec.ts

  release:
    # The content repository publishes the site with the code at `release`: the newest commit of
    # main that has passed every check above. A push that fails leaves `release` where it was, so
    # a mistake in the code cannot stop the next change of content from being published.
    #
    # Moving `release` does not publish by itself. The site is published by the content
    # repository's "Publish" workflow: on its nightly run, when content next changes, or at once
    # with `npm run publish`.
    name: Mark this commit as the code to publish with
    needs: [verify, live-content]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      # This job runs nothing from the repository: it only moves a branch.
      - uses: actions/checkout@v7
      - run: git push --force origin "HEAD:refs/heads/release"
